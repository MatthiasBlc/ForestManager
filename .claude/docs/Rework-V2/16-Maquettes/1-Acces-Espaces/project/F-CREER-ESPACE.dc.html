<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un espace</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="2" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.TopBar" title="Accueil" space="{{me}}"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Créer un espace" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; gap: 14px; align-items: center;">
<span style="width: 64px; height: 64px; flex: none; border-radius: var(--radius-lg); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 26px/1 var(--font-display);">V</span>
<x-import component-from-global-scope="ForestUI.Button" icon="plus" size="sm">Ajouter une photo</x-import>
</div>
<x-import component-from-global-scope="ForestUI.Field" label="Nom de l'espace" default-value="Vacances au chalet"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font: 600 14px/20px var(--font-sans);">Couleur de l'espace</span>
<x-import component-from-global-scope="ForestUI.TintPicker" label="Couleur de l'espace" default-value="{{two}}" names="{{tintNames}}"></x-import>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Tu en seras le propriétaire. L'espace commence avec le module Recettes ; tu pourras inviter des membres juste après.</p>
</div>
<x-import component-from-global-scope="ForestUI.SheetFooter">
<x-import component-from-global-scope="ForestUI.Button" variant="primary">Créer l'espace</x-import>
</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, noop: () => {}, two: 2,
tintNames: ['Braise', 'Nuit', 'Tison', 'Flamme', 'Cendre'],
me: { id: 'me', name: 'Matthias' },

spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
