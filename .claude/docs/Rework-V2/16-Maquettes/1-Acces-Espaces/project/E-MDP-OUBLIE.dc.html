<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mot de passe oublié</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="padding: 8px 8px 0;">
<x-import component-from-global-scope="ForestUI.IconButton" icon="x" label="Fermer"></x-import>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 24px 32px;">
<h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Mot de passe oublié</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Indique l'adresse de ton compte : nous t'envoyons un lien pour choisir un nouveau mot de passe.</p>
<x-import component-from-global-scope="ForestUI.Field" label="Adresse e-mail" type="email" default-value="matthias@exemple.fr"></x-import>
<div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--success-soft); color: var(--success-text); font-size: 14px; line-height: 20px;">
<x-import component-from-global-scope="ForestUI.Icon" name="check"></x-import>
<span>Lien envoyé. Pense à regarder dans tes indésirables.</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Envoyer le lien</x-import>
<p style="margin: 0; text-align: center; font-size: 14px;"><a href="E-CONNEXION.dc.html">Revenir à la connexion</a></p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
