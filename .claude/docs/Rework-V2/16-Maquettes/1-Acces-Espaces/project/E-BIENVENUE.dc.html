<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bienvenue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--ink);text-decoration:none}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 64px 20px 32px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px;">
<h1 style="margin: 0; font: 700 32px/38px var(--font-display);">Bienvenue, Matthias</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Par quoi veux-tu commencer ?</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<a href="F-CREER-ESPACE.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line); box-shadow: var(--shadow-sm); min-height: 44px;">
<span style="width: 48px; height: 48px; flex: none; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center;"><x-import component-from-global-scope="ForestUI.Icon" name="users"></x-import></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font: 600 16px/22px var(--font-display);">Créer un espace</b><span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Pour ta famille, tes amis, ta colloc.</span></span>
<x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import>
</a>
<a href="E-REJOINDRE.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line); box-shadow: var(--shadow-sm); min-height: 44px;">
<span style="width: 48px; height: 48px; flex: none; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center;"><x-import component-from-global-scope="ForestUI.Icon" name="link"></x-import></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font: 600 16px/22px var(--font-display);">J'ai un lien d'invitation</b><span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Colle-le pour rejoindre l'espace.</span></span>
<x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import>
</a>
<a href="#premiere-recette" style="display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line); box-shadow: var(--shadow-sm); min-height: 44px;">
<span style="width: 48px; height: 48px; flex: none; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center;"><x-import component-from-global-scope="ForestUI.Icon" name="book-open"></x-import></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font: 600 16px/22px var(--font-display);">Ajouter ma première recette</b><span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">À la main, depuis un lien ou un texte collé.</span></span>
<x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import>
</a>
</div>
<div style="margin-top: auto;">
<x-import component-from-global-scope="ForestUI.Button" variant="ghost" block="{{yes}}">Plus tard</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
