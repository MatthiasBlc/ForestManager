<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Se connecter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 56px 24px 32px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; gap: 8px; align-items: center;">
<span style="width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 15px/1 var(--font-display);">F</span>
<span style="font: 700 17px/22px var(--font-display);">Forest Manager</span>
</div>
<h1 style="margin: 8px 0 0; font: 700 26px/32px var(--font-display);">Se connecter</h1>
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--danger-soft); color: var(--danger-text); font-size: 14px; line-height: 20px;">
<x-import component-from-global-scope="ForestUI.Icon" name="x"></x-import>
<span>Adresse ou mot de passe incorrect. Vérifie-les, ou réinitialise ton mot de passe.</span>
</div>
<x-import component-from-global-scope="ForestUI.Field" label="E-mail ou nom d'utilisateur" default-value="matthias"></x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Mot de passe" type="password" default-value="motdepass" error="Mot de passe incorrect."></x-import>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
<x-import component-from-global-scope="ForestUI.Switch" label="Rester connecté" default-checked="{{yes}}"></x-import>
<a href="E-MDP-OUBLIE.dc.html" style="font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center;">Mot de passe oublié ?</a>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Se connecter</x-import>
<p style="margin: 0; text-align: center; font-size: 14px;">Pas encore de compte ? <a href="E-INSCRIPTION.dc.html">Créer un compte</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
