<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rejoindre Famille</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: 72px 24px 32px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;">
<span style="font-size: 14px; color: var(--ink-muted);">Matthias t'invite à rejoindre</span>
<span style="width: 88px; height: 88px; border-radius: var(--radius-xl); background: var(--tint-1); color: var(--on-tint-1); display: grid; place-items: center; font: 700 36px/1 var(--font-display);">F</span>
<h1 style="margin: 0; font: 700 30px/36px var(--font-display);">Famille</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted); max-width: 30ch;">Les recettes de la famille et le planning des repas du dimanche.</p>
<div style="display: flex; align-items: center; gap: 10px;">
<div style="display: flex;">
<x-import component-from-global-scope="ForestUI.Avatar" name="Matthias" size="{{s}}"></x-import>
<x-import component-from-global-scope="ForestUI.Avatar" name="Lea" tint="{{t1}}" size="{{s}}"></x-import>
<x-import component-from-global-scope="ForestUI.Avatar" name="Jeanne" tint="{{t2}}" size="{{s}}"></x-import>
<x-import component-from-global-scope="ForestUI.Avatar" name="Paul" tint="{{t3}}" size="{{s}}"></x-import>
</div>
<span style="font-size: 14px; color: var(--ink-muted);">5 membres</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Rejoindre Famille</x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="ghost" block="{{yes}}">Pas maintenant</x-import>
<p style="margin: 4px 0 0; text-align: center; font-size: 13px; line-height: 18px; color: var(--ink-muted);">Lien valable jusqu'au 10 novembre. Tu pourras quitter l'espace quand tu veux.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true, s: 32, t1: 5, t2: 2, t3: 4 }; }
}
</script>
</body>
</html>
