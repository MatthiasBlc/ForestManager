<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveau mot de passe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 56px 24px 32px; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Choisis un nouveau mot de passe</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Pour le compte matthias. Tu resteras connecté sur cet appareil ; les autres seront déconnectés.</p>
<x-import component-from-global-scope="ForestUI.Field" label="Nouveau mot de passe" type="password" default-value="nouveaumdp" hint="8 caractères minimum."></x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Confirme-le" type="password" default-value="nouveaumd" error="Les deux mots de passe ne sont pas identiques."></x-import>
<div style="margin-top: auto;">
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Enregistrer le mot de passe</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
