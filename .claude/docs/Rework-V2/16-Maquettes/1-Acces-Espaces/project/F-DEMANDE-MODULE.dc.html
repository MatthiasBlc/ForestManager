<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Demander le planning</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="2" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="colloc"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Modules"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Demander le planning des repas" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">L'équipe Forest Manager étudie ta demande pour Colloc. Tu recevras une notification avec sa réponse ; tu pourras ensuite activer le module.</p>
<x-import component-from-global-scope="ForestUI.Field" label="Message (facultatif)" multiline="{{yes}}" placeholder="Ex : on veut organiser les dîners de la semaine à trois."></x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Envoyer la demande</x-import>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, noop: () => {},
me: { id: 'me', name: 'Matthias' },
spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
