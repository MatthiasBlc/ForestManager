<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Transférer la propriété</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.TopBar" title="Réglages" space="{{space}}"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Transférer la propriété" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Choisis le membre qui deviendra propriétaire de Famille.</p>
<x-import component-from-global-scope="ForestUI.OptionList" label="Nouveau propriétaire" options="{{members}}" default-value="lea"></x-import>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Léa recevra une demande à accepter. Une fois acceptée, tu deviendras modérateur de Famille.</p>
</div>
<x-import component-from-global-scope="ForestUI.SheetFooter">
<x-import component-from-global-scope="ForestUI.Button" variant="primary">Proposer à Léa</x-import>
</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, noop: () => {},
members: [
{ value: 'lea', label: 'Léa', hint: 'Modératrice', avatar: 'Léa', tint: 5 },
{ value: 'jeanne', label: 'Jeanne', hint: 'Membre', avatar: 'Jeanne', tint: 2 },
{ value: 'paul', label: 'Paul', hint: 'Membre', avatar: 'Paul', tint: 4 },
{ value: 'sam', label: 'Sam', hint: 'Membre', avatar: 'Sam', tint: 3 },
{ value: 'claire', label: 'Claire', hint: 'Membre', avatar: 'Claire', tint: 1 }
],
me: { id: 'me', name: 'Matthias' },
space: { id: 'famille', name: 'Famille', tint: 1 },

spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
