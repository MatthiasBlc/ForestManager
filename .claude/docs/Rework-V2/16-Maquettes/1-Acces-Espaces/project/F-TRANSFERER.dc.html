<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Transférer la propriété</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.opt input{width:22px;height:22px;accent-color:var(--accent);margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="famille"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Réglages de Famille"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Transférer la propriété" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Choisis le membre qui deviendra propriétaire de Famille.</p>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); overflow: hidden;">
<legend class="fm-sr">Nouveau propriétaire</legend>
<label class="opt" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line); cursor: pointer;"><input type="radio" name="owner" value="lea" checked><x-import component-from-global-scope="ForestUI.Avatar" name="Lea" tint="{{five}}"></x-import><span style="flex: 1; font-size: 15px;"><b>Lea</b><br><span style="font-size: 13px; color: var(--ink-muted);">Modératrice</span></span></label>
<label class="opt" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line); cursor: pointer;"><input type="radio" name="owner" value="jeanne"><x-import component-from-global-scope="ForestUI.Avatar" name="Jeanne" tint="{{two}}"></x-import><span style="flex: 1; font-size: 15px;"><b>Jeanne</b><br><span style="font-size: 13px; color: var(--ink-muted);">Membre</span></span></label>
<label class="opt" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px; cursor: pointer;"><input type="radio" name="owner" value="paul"><x-import component-from-global-scope="ForestUI.Avatar" name="Paul" tint="{{four}}"></x-import><span style="flex: 1; font-size: 15px;"><b>Paul</b><br><span style="font-size: 13px; color: var(--ink-muted);">Membre</span></span></label>
</fieldset>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Lea recevra une demande à accepter. Une fois acceptée, tu deviendras modérateur de Famille.</p>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Proposer à Lea</x-import>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, noop: () => {}, two: 2, four: 4, five: 5,
me: { id: 'me', name: 'Matthias' },
spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
