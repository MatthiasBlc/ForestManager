<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inviter dans Famille</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.TopBar" title="Membres" space="{{space}}"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Inviter dans Famille" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Mode d'invitation" options="{{modes}}" default-value="link"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font: 600 14px/20px var(--font-sans);">Valable</span>
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Durée du lien" options="{{durations}}" default-value="7"></x-import>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="font: 600 14px/20px var(--font-sans);">Nombre de personnes</span>
<x-import component-from-global-scope="ForestUI.Stepper" label="Nombre d'utilisations" default-value="{{uses}}" min="{{one}}" max="{{twenty}}"></x-import>
</div>
<div style="display: flex; gap: 8px; align-items: center; padding: 10px 10px 10px 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line);">
<span style="flex: 1; min-width: 0; font: 500 14px/20px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">forestmanager.fr/i/k7Q2-pX9a</span>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" size="sm" icon="link">Copier</x-import>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted);">Partage ce lien par message. Il permet à 3 personnes de rejoindre Famille pendant 7 jours.</p>
<div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px;">
<span style="font: 600 12px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);">Liens actifs</span>
<div style="display: flex; align-items: center; gap: 8px;">
<span style="flex: 1; font-size: 14px; line-height: 20px;">Créé le 28 octobre<br><span style="color: var(--ink-muted); font-size: 13px;">2 utilisations sur 5, expire le 4 novembre</span></span>
<x-import component-from-global-scope="ForestUI.Button" variant="ghost" size="sm">Révoquer</x-import>
</div>
</div>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, noop: () => {}, uses: 3, one: 1, twenty: 20,
modes: [{ value: 'link', label: 'Par lien' }, { value: 'name', label: 'Par nom d’utilisateur' }],
durations: [{ value: '1', label: '1 jour' }, { value: '7', label: '7 jours' }, { value: '30', label: '30 jours' }],
me: { id: 'me', name: 'Matthias' },
space: { id: 'famille', name: 'Famille', tint: 1 },

spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
