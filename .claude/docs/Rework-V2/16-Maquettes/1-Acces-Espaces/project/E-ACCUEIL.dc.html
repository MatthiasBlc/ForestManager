<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<div role="status" style="display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--warning-soft); color: var(--warning-text); font-size: 13px; line-height: 18px; font-weight: 600;">
<x-import component-from-global-scope="ForestUI.Icon" name="wifi-off" size="{{small}}"></x-import>
<span>Hors ligne. Tu consultes la dernière version enregistrée.</span>
</div>
<x-import component-from-global-scope="ForestUI.TopBar" title="Accueil" space="{{me}}" unread="{{unread}}"></x-import>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 16px;">
<h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Bonsoir, Matthias</h1>
<section style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 style="margin: 0; font: 600 16px/22px var(--font-display);">Prochains repas</h2><span style="font-size: 13px; color: var(--ink-muted);">Famille</span></div>
<x-import component-from-global-scope="ForestUI.MealSlot" kind="recipe" title="Saumon teriyaki et brocolis" servings="{{two}}" when="Ce soir"></x-import>
<x-import component-from-global-scope="ForestUI.MealSlot" kind="recipe" title="Gratin de pâtes" locked="{{yes}}" when="Demain midi"></x-import>
</section>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font: 600 16px/22px var(--font-display);">Tes recettes les plus cuisinées</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<x-import component-from-global-scope="ForestUI.RecipeCard" title="Poulet teriyaki et riz" meta="Cuisinée 9 fois"></x-import>
<x-import component-from-global-scope="ForestUI.RecipeCard" title="Dahl de lentilles corail" meta="Cuisinée 7 fois"></x-import>
</div>
</section>
</div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="home"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, two: 2, four: 4, forty: 40, small: 16, unread: 2,
me: { id: 'me', name: 'Matthias', hint: 'Espace perso' },
spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1, unread: true },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
],
tabs: [
{ id: 'home', label: 'Accueil', icon: 'home' },
{ id: 'recipes', label: 'Recettes', icon: 'book-open' },
{ id: 'mine', label: 'Mes recettes', icon: 'chef-hat' }
]
};
}
}
</script>
</body>
</html>
