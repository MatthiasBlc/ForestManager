<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages de Famille</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--ink);text-decoration:none}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="famille"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Réglages de Famille"></x-import>
<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 16px;">
<div style="display: flex; gap: 14px; align-items: center;">
<span style="width: 56px; height: 56px; border-radius: var(--radius-lg); background: var(--tint-1); color: var(--on-tint-1); display: grid; place-items: center; font: 700 22px/1 var(--font-display);">F</span>
<span style="flex: 1; display: flex; flex-direction: column;"><b style="font: 600 18px/24px var(--font-display);">Famille</b><span style="font-size: 13px; color: var(--ink-muted);">6 membres - tu es propriétaire</span></span>
<x-import component-from-global-scope="ForestUI.Button" size="sm" icon="pencil">Modifier</x-import>
</div>
<nav aria-label="Réglages" style="display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line); overflow: hidden;">
<a href="E-MEMBRES.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="ForestUI.Icon" name="users"></x-import><span style="flex: 1; font-size: 15px;">Membres et invitations</span><x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import></a>
<a href="E-MODULES.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="ForestUI.Icon" name="sparkles"></x-import><span style="flex: 1; font-size: 15px;">Modules</span><span style="font-size: 13px; color: var(--ink-muted);">2 actifs</span><x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import></a>
<a href="#planning" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="ForestUI.Icon" name="calendar"></x-import><span style="flex: 1; font-size: 15px;">Planning des repas</span><x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import></a>
<a href="#export" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px;"><x-import component-from-global-scope="ForestUI.Icon" name="share"></x-import><span style="flex: 1; font-size: 15px;">Exporter les recettes de l'espace</span><x-import component-from-global-scope="ForestUI.Icon" name="chevron-right"></x-import></a>
</nav>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font: 600 12px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);">Propriété et départ</h2>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.Button" block="{{yes}}">Transférer la propriété</x-import>
<x-import component-from-global-scope="ForestUI.Button" block="{{yes}}" disabled="{{yes}}">Quitter Famille</x-import>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Pour quitter l'espace, transfère d'abord la propriété à un membre.</span>
<x-import component-from-global-scope="ForestUI.Button" variant="danger" block="{{yes}}" icon="trash">Supprimer Famille</x-import>
</div>
</section>
</div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="more"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
me: { id: 'me', name: 'Matthias' },
spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
],
tabs: [
{ id: 'recipes', label: 'Recettes', icon: 'book-open' },
{ id: 'plan', label: 'Planning', icon: 'calendar' },
{ id: 'members', label: 'Membres', icon: 'users' },
{ id: 'more', label: 'Plus', icon: 'more' }
]
};
}
}
</script>
</body>
</html>
