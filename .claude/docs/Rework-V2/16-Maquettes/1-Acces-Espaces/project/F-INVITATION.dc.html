<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invitation reçue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="4" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="me"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Accueil" unread="{{unread}}"></x-import>
<div style="flex: 1; padding: 16px;"><h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Bonsoir, Matthias</h1></div>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Invitation de Claire" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; gap: 14px; align-items: center;">
<span style="width: 56px; height: 56px; border-radius: var(--radius-lg); background: var(--tint-4); color: var(--on-tint-4); display: grid; place-items: center; font: 700 22px/1 var(--font-display);">C</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><b style="font: 600 18px/24px var(--font-display);">Cousins</b><span style="font-size: 14px; color: var(--ink-muted);">8 membres, dont Paul et Jeanne</span></span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Claire t'invite à rejoindre son espace. Tu verras ses recettes et pourras y partager les tiennes.</p>
<div style="display: flex; gap: 8px;">
<x-import component-from-global-scope="ForestUI.Button" style="flex: 1;">Refuser</x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" style="flex: 1;">Rejoindre Cousins</x-import>
</div>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, unread: 1, noop: () => {},
me: { id: 'me', name: 'Matthias' },
spaces: [
{ id: 'foyer', name: 'Foyer', tint: 5 },
{ id: 'famille', name: 'Famille', tint: 1 },
{ id: 'colloc', name: 'Colloc', tint: 2 },
{ id: 'tom', name: 'TOM', tint: 3 },
{ id: 'amis', name: 'Amis', tint: 4 }
]
};
}
}
</script>
</body>
</html>
