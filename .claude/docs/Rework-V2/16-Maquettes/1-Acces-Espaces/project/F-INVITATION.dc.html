<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invitation reçue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<x-import component-from-global-scope="ForestUI.TopBar" title="Accueil" space="{{me}}" unread="{{unread}}"></x-import>
<div style="flex: 1; padding: 16px;"><h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Bonsoir, Claire</h1></div>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Invitation de Matthias" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; gap: 14px; align-items: center;">
<span style="width: 56px; height: 56px; border-radius: var(--radius-lg); background: var(--tint-1); color: var(--on-tint-1); display: grid; place-items: center; font: 700 22px/1 var(--font-display);">F</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><b style="font: 600 18px/24px var(--font-display);">Famille</b><span style="font-size: 14px; color: var(--ink-muted);">5 membres, dont Lea et Jeanne</span></span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Matthias t'invite à rejoindre son espace. Tu verras ses recettes et pourras y partager les tiennes.</p>
</div>
<x-import component-from-global-scope="ForestUI.SheetFooter">
<x-import component-from-global-scope="ForestUI.Button">Refuser</x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="primary">Rejoindre Famille</x-import>
</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true, unread: 1, noop: () => {},
me: { id: 'me', name: 'Claire' }
};
}
}
</script>
</body>
</html>
