<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0;">
<x-import component-from-global-scope="ForestUI.IconButton" icon="chevron-right" label="Retour" style="transform: scaleX(-1);"></x-import>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 24px 32px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Créer un compte</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Ton espace perso est créé en même temps.</p>
</div>
<x-import component-from-global-scope="ForestUI.Field" label="Adresse e-mail" type="email" default-value="matthias@exemple.fr"></x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Nom d'utilisateur" default-value="matthias" hint="Visible par les membres de tes espaces. Il sert aussi à t'inviter."></x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Mot de passe" type="password" default-value="motdepasse" hint="8 caractères minimum."></x-import>
<x-import component-from-global-scope="ForestUI.Switch" label="Rester connecté sur cet appareil" default-checked="{{yes}}"></x-import>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
<x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Créer mon compte</x-import>
<p style="margin: 0; text-align: center; font-size: 14px;">Déjà inscrit ? <a href="E-CONNEXION.dc.html">Se connecter</a></p>
<p style="margin: 0; text-align: center; font-size: 12px; line-height: 16px; color: var(--ink-muted);">En créant un compte, tu acceptes la <a href="#confidentialite">politique de confidentialité</a>.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
