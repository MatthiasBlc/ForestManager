<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier un repas</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="f"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Planning"></x-import>
<div style="flex-grow: 1;"></div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="plan"></x-import>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" contained="{{yes}}" title="Mardi 3, soir" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Type de repas" options="{{kinds}}" default-value="recipe"></x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Recette" placeholder="Rechercher dans Famille et dans mes recettes" default-value="teri"></x-import>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: -8px;">
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--accent-text); background: var(--accent-soft); color: var(--accent-text); font-family: var(--font-sans); text-align: left; cursor: pointer;">
<span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 15px; line-height: 20px;">Poulet teriyaki et riz</b><span style="font-size: 13px; line-height: 18px; opacity: 0.9;">Famille · 4 pers. · planifié il y a 3 semaines</span></span>
<x-import component-from-global-scope="ForestUI.Icon" name="check"></x-import>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: var(--font-sans); text-align: left; cursor: pointer;">
<span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 15px; line-height: 20px;">Saumon teriyaki et brocolis</b><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Famille · déjà prévu mardi midi</span></span>
</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">Portions</span>
<x-import component-from-global-scope="ForestUI.Stepper" label="Portions" default-value="{{six}}" unit="pers."></x-import>
</div>
<x-import component-from-global-scope="ForestUI.Field" label="Commentaire" placeholder="Visible en touchant le repas" default-value="Sam apporte le dessert"></x-import>
<x-import component-from-global-scope="ForestUI.Switch" label="Verrouiller : la génération ne le remplace pas"></x-import>
<div style="display: flex; gap: 8px;">
<x-import component-from-global-scope="ForestUI.Button" variant="secondary" style="flex-grow: 1;">Vider le repas</x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" style="flex-grow: 1;">Enregistrer</x-import>
</div>
</div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, six: 6, noop: function () {},
      kinds: [{ value: 'recipe', label: 'Recette' }, { value: 'text', label: 'Texte libre' }],
      me: { id: 'me', name: 'Matthias' },
      spaces: [{ id: 'foyer', name: 'Foyer', tint: 5 }, { id: 'f', name: 'Famille', tint: 1 }, { id: 'c', name: 'Colloc', tint: 2 }, { id: 't', name: 'TOM', tint: 3 }, { id: 'a', name: 'Amis', tint: 4 }],
      tabs: [{ id: 'recipes', label: 'Recettes', icon: 'book-open' }, { id: 'plan', label: 'Planning', icon: 'calendar' }, { id: 'members', label: 'Membres', icon: 'users' }, { id: 'more', label: 'Plus', icon: 'more' }]
    };
  }
}
</script>
</body>
</html>
