<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Supprimer mon compte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.TopBar" title="Profil" on-back="{{noop}}"></x-import>
<div style="flex-grow: 1;"></div>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" contained="{{yes}}" title="Supprimer mon compte" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 15px; line-height: 22px;">Voici ce qui se passera. Rien n’est supprimé avant ta confirmation.</p>
<div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden;">
<sc-for list="{{spaces}}" as="s" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface-raised);">
<x-import component-from-global-scope="ForestUI.Avatar" name="{{s.name}}" tint="{{s.tint}}" size="{{twentyEight}}"></x-import>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;"><b style="font-size: 14px; line-height: 20px;">{{s.name}}</b><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{s.effect}}</span></span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Tes recettes partagées dans ces espaces restent, signées « Ancien membre ». Ton espace perso et tes recettes perso sont supprimés.</p>
<x-import component-from-global-scope="ForestUI.Button" variant="secondary" icon="book-open" block="{{yes}}">Exporter mes recettes d’abord</x-import>
<x-import component-from-global-scope="ForestUI.Field" label="Mot de passe" type="password" default-value="motdepasse" error="Mot de passe incorrect. Vérifie-le et réessaie."></x-import>
</div>
<x-import component-from-global-scope="ForestUI.SheetFooter">
<x-import component-from-global-scope="ForestUI.Button" variant="danger" icon="trash">Supprimer définitivement mon compte</x-import>
</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, twentyEight: 28, noop: function () {},
      spaces: [
        { name: 'Famille', tint: 1, effect: 'Tu en es l’OWNER : propriété transférée à Sam, modérateur le plus ancien' },
        { name: 'Foyer', tint: 5, effect: 'Tu en es l’OWNER : propriété transférée à Léa' },
        { name: 'Colloc', tint: 2, effect: 'Tu en es l’OWNER : propriété transférée au membre le plus ancien' },
        { name: 'TOM', tint: 3, effect: 'Tu quittes l’espace (modérateur)' },
        { name: 'Amis', tint: 4, effect: 'Tu quittes l’espace (membre)' }
      ]
    };
  }
}
</script>
</body>
</html>
