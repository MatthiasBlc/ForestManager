<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Dans tous tes espaces</span>
<x-import component-from-global-scope="ForestUI.Button" variant="ghost" size="sm">Fermer</x-import>
</div>
<x-import component-from-global-scope="ForestUI.CommandPalette" default-query="teri" groups="{{groups}}" style="width: 100%;"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { label: 'Recettes', items: [
          { id: 'r1', label: 'Sauce teriyaki', icon: 'book-open', hint: 'Famille · base' },
          { id: 'r2', label: 'Saumon teriyaki et brocolis', icon: 'book-open', hint: 'Famille' },
          { id: 'r3', label: 'Poulet teriyaki et riz', icon: 'book-open', hint: 'TOM' }
        ] },
        { label: 'Planning', items: [
          { id: 'p1', label: 'Mardi midi : Saumon teriyaki et brocolis', icon: 'calendar', hint: 'Famille' }
        ] },
        { label: 'Actions', items: [
          { id: 'a1', label: 'Nouvelle recette', icon: 'plus' },
          { id: 'a2', label: 'Générer le planning', icon: 'sparkles' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
