<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Idées de repas</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.TopBar" title="Idées de repas" on-back="{{noop}}"></x-import>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px;">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">Ce qu’on aimerait cuisiner un jour. La génération peut les proposer dans le planning.</p>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" icon="plus" style="align-self: flex-start;">Nouvelle idée</x-import>
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="4">
<article style="display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 8px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface-raised);">
<div style="display: flex; align-items: flex-start; gap: 10px;">
<x-import component-from-global-scope="ForestUI.Avatar" name="{{i.author}}" tint="{{i.tint}}" size="{{twentyEight}}"></x-import>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
<b style="font-size: 15px; line-height: 20px;">{{i.name}}</b>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{i.comment}}</span>
</div>
<x-import component-from-global-scope="ForestUI.IconButton" icon="more" label="Actions de l’idée"></x-import>
</div>
<sc-if value="{{i.linked}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="ForestUI.Badge" tone="second" icon="link">Liée à Dahl de lentilles corail</x-import>
</sc-if>
<sc-if value="{{i.convertible}}" hint-placeholder-val="{{true}}">
<a href="F-IDEE-RECETTE.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: var(--radius-md); font-size: 14px; line-height: 20px; font-weight: 600; color: var(--accent-text); text-decoration: none;"><x-import component-from-global-scope="ForestUI.Icon" name="chef-hat" size="{{eighteen}}"></x-import>Transformer en recette</a>
</sc-if>
</article>
</sc-for>
</div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="plan"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      twentyEight: 28, eighteen: 18,
      ideas: [
        { name: 'Lasagnes végétariennes', comment: 'Celles de la cantine de Noé, à retrouver', author: 'Sam', tint: 2, convertible: true, linked: false },
        { name: 'Curry de pois chiches', comment: 'Avec du lait de coco, pas trop épicé', author: 'Léa', tint: 5, convertible: true, linked: false },
        { name: 'Dahl version courge', comment: 'Ajouter de la courge rôtie', author: 'Matthias', tint: 1, convertible: false, linked: true },
        { name: 'Raclette', comment: 'Un dimanche soir en hiver', author: 'Jeanne', tint: 3, convertible: true, linked: false }
      ],
      noop: function () {},
      space: { id: 'f', name: 'Famille', tint: 1 },
      tabs: [{ id: 'recipes', label: 'Recettes', icon: 'book-open' }, { id: 'plan', label: 'Planning', icon: 'calendar' }]
    };
  }
}
</script>
</body>
</html>
