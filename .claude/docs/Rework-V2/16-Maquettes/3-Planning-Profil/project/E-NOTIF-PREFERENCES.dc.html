<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Préférences de notifications</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--ink);text-decoration:none}
</style>
</helmet>
<div class="fm-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.TopBar" title="Notifications" on-back="{{noop}}"></x-import>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 20px 16px;">
<section style="display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0 0 4px; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Me prévenir pour</h2>
<sc-for list="{{categories}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; padding: 4px 0; border-bottom: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.Switch" label="{{c.label}}" default-checked="{{c.on}}"></x-import>
<span style="margin-top: -8px; padding-bottom: 8px; padding-left: 56px; font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{c.hint}}</span>
</div>
</sc-for>
</section>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Par espace</h2>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Pour un grand espace bavard, garde l’essentiel.</span>
<nav aria-label="Préférences par espace" style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); overflow: hidden;">
<sc-for list="{{spaces}}" as="s" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.Avatar" name="{{s.name}}" tint="{{s.tint}}" size="{{thirtyTwo}}"></x-import>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 15px; line-height: 20px;">{{s.name}}</b><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{s.mode}}</span></span>
<x-import component-from-global-scope="ForestUI.Icon" name="chevron-right" size="{{sixteen}}"></x-import>
</a>
</sc-for>
</nav>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      noop: function () {},
      thirtyTwo: 32, sixteen: 16,
      categories: [
        { label: 'Invitations et membres', hint: 'Invitations reçues, arrivées dans tes espaces', on: true },
        { label: 'Suggestions et partages', hint: 'Sur tes recettes : suggestions, demandes de partage', on: true },
        { label: 'Nouvelles recettes', hint: 'Ajoutées dans tes espaces', on: false },
        { label: 'Planning', hint: 'Planning généré, repas modifié par quelqu’un d’autre', on: true },
        { label: 'Nouveautés de Forest Manager', hint: 'Une nouvelle version est disponible', on: true }
      ],
      spaces: [
        { name: 'Famille', tint: 1, mode: 'Comme ci-dessus' },
        { name: 'Foyer', tint: 5, mode: 'Comme ci-dessus' },
        { name: 'TOM', tint: 3, mode: 'Personnalisé : invitations seulement' },
        { name: 'Colloc', tint: 2, mode: 'Comme ci-dessus' },
        { name: 'Amis', tint: 4, mode: 'Comme ci-dessus' }
      ]
    };
  }
}
</script>
</body>
</html>
