<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Échanger deux repas</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.TopBar" title="Planning" space="{{space}}" on-space="{{noop}}"></x-import>
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--accent-soft); color: var(--accent-text); border-bottom: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.Icon" name="refresh"></x-import>
<span style="flex-grow: 1; font-size: 14px; line-height: 20px; font-weight: 600;">Touche le repas qui prend la place de « Saumon teriyaki », sur n’importe quel jour.</span>
<x-import component-from-global-scope="ForestUI.Button" variant="ghost" size="sm">Annuler</x-import>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px;">
<div style="display: flex; gap: 6px; overflow-x: auto;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
<button type="button" aria-current="date" style="flex: none; width: 46px; height: 56px; border-radius: var(--radius-md); border: 1px solid transparent; background: var(--accent); color: var(--on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--font-sans);"><span style="font-size: 12px; font-weight: 600;">{{d.day}}</span><span style="font-size: 17px; font-weight: 700;">{{d.num}}</span></button>
</sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
<button type="button" style="flex: none; width: 46px; height: 56px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--font-sans);"><span style="font-size: 12px; font-weight: 600; color: var(--ink-muted);">{{d.day}}</span><span style="font-size: 17px; font-weight: 700;">{{d.num}}</span></button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Mardi midi · repas à déplacer</span>
<div style="border-radius: 12px; outline: 2px solid var(--accent); outline-offset: 2px; opacity: 0.75;">
<x-import component-from-global-scope="ForestUI.MealSlot" kind="recipe" title="Saumon teriyaki et brocolis" servings="{{two}}" when="Mardi midi"></x-import>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Mardi soir</span>
<div style="border-radius: 12px; outline: 2px dashed var(--accent-text); outline-offset: 2px;">
<x-import component-from-global-scope="ForestUI.MealSlot" kind="empty" placeholder="Déplacer ici" when="Mardi soir"></x-import>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line);">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Mercredi 4</span>
<div style="border-radius: 12px; outline: 2px dashed var(--accent-text); outline-offset: 2px;">
<x-import component-from-global-scope="ForestUI.MealSlot" kind="text" title="Restes du dimanche" when="Mercredi midi"></x-import>
</div>
<div style="border-radius: 12px; outline: 2px dashed var(--accent-text); outline-offset: 2px;">
<x-import component-from-global-scope="ForestUI.MealSlot" kind="recipe" title="Gratin de pâtes" servings="{{six}}" when="Mercredi soir"></x-import>
</div>
</div>
</div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="plan"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['LUN', 'MAR', 'MER', 'JEU', 'VEN', 'SAM', 'DIM'];
    return {
      two: 2, six: 6,
      days: names.map(function (n, i) { return { day: n, num: String(i + 2), on: i === 1, off: i !== 1 }; }),
      noop: function () {},
      space: { id: 'f', name: 'Famille', tint: 1 },
      tabs: [{ id: 'recipes', label: 'Recettes', icon: 'book-open' }, { id: 'plan', label: 'Planning', icon: 'calendar' }]
    };
  }
}
</script>
</body>
</html>
