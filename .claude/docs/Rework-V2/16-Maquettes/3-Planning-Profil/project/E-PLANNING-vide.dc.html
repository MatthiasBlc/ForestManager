<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planning - vide</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="5" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{me}}" active-id="foyer"></x-import>
<x-import component-from-global-scope="ForestUI.TopBar" title="Planning"></x-import>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0; padding: 16px;">
<x-import component-from-global-scope="ForestUI.EmptyState" icon="calendar" title="Pas encore de planning dans Foyer">Prévois vos repas de la semaine, à la main ou en un geste avec la génération.</x-import>
<x-import component-from-global-scope="ForestUI.Button" variant="primary" icon="plus">Créer le planning</x-import>
</div>
<x-import component-from-global-scope="ForestUI.TabBar" items="{{tabs}}" active-id="plan"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      me: { id: 'me', name: 'Matthias' },
      spaces: [{ id: 'foyer', name: 'Foyer', tint: 5 }, { id: 'f', name: 'Famille', tint: 1 }, { id: 'c', name: 'Colloc', tint: 2 }, { id: 't', name: 'TOM', tint: 3 }, { id: 'a', name: 'Amis', tint: 4 }],
      tabs: [{ id: 'recipes', label: 'Recettes', icon: 'book-open' }, { id: 'plan', label: 'Planning', icon: 'calendar' }, { id: 'members', label: 'Membres', icon: 'users' }, { id: 'more', label: 'Plus', icon: 'more' }]
    };
  }
}
</script>
</body>
</html>
