<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Apparence</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<div style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px; border-bottom: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.IconButton" icon="chevron-right" label="Retour au profil" style="transform: scaleX(-1);"></x-import>
<h1 style="margin: 0; flex-grow: 1; font-family: var(--font-display); font-size: 20px; line-height: 26px;">Apparence</h1>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 20px 16px;">
<section style="display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Ambiance</h2>
<sc-for list="{{ambiances}}" as="a" hint-placeholder-count="3">
<button type="button" aria-pressed="{{a.pressed}}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-lg); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); font-family: var(--font-sans); text-align: left; cursor: pointer;">
<span data-theme="{{a.theme}}" aria-hidden="true" style="flex: none; width: 112px; height: 64px; border-radius: 10px; background: var(--bg); display: flex; gap: 6px; padding: 6px; box-sizing: border-box;">
<span style="width: 18px; border-radius: 6px; background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--tint-1);"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--tint-2);"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--tint-3);"></span></span>
<span style="flex-grow: 1; border-radius: 6px; background: var(--surface-raised); display: flex; flex-direction: column; gap: 4px; padding: 6px;"><span style="height: 6px; width: 70%; border-radius: 3px; background: var(--ink);"></span><span style="height: 6px; width: 45%; border-radius: 3px; background: var(--ink-muted);"></span><span style="height: 12px; width: 52%; border-radius: 4px; background: var(--accent); margin-top: auto;"></span></span>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 15px; line-height: 20px;">{{a.name}}</b><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{a.desc}}</span></span>
<sc-if value="{{a.selected}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="ForestUI.Badge" tone="accent" icon="check">Active</x-import></sc-if>
</button>
</sc-for>
</section>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Clair ou sombre</h2>
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Mode d’affichage" options="{{modes}}" default-value="system"></x-import>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">« Système » suit le réglage de ton téléphone.</span>
</section>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Densité</h2>
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Densité" options="{{densities}}" default-value="comfortable"></x-import>
</section>
<section style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px;">Taille du texte</h2>
<x-import component-from-global-scope="ForestUI.SegmentedControl" label="Taille du texte" options="{{sizes}}" default-value="100"></x-import>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: 'Braise', desc: 'Charbon et ambre, l’ambiance de Forest Manager', theme: 'braise-dark', selected: true },
      { name: 'Sous-bois', desc: 'Verts de forêt, mousse et bois clair', theme: 'sousbois-dark', selected: false },
      { name: 'Potager', desc: 'Les couleurs des légumes, vives et gaies', theme: 'potager-dark', selected: false }
    ];
    return {
      ambiances: list.map(function (a) { return Object.assign({}, a, { pressed: String(a.selected) }); }),
      modes: [{ value: 'system', label: 'Système' }, { value: 'light', label: 'Clair' }, { value: 'dark', label: 'Sombre' }],
      densities: [{ value: 'comfortable', label: 'Confortable' }, { value: 'compact', label: 'Compacte' }],
      sizes: [{ value: '90', label: 'Petite' }, { value: '100', label: 'Normale' }, { value: '115', label: 'Grande' }, { value: '130', label: 'Très grande' }]
    };
  }
}
</script>
</body>
</html>
