<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Exporter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
<x-import component-from-global-scope="ForestUI.TopBar" title="Profil" on-back="{{noop}}"></x-import>
<div style="flex-grow: 1;"></div>
<x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" contained="{{yes}}" title="Exporter des recettes" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 16px;">
<x-import component-from-global-scope="ForestUI.RadioGroup" label="Recettes à exporter" options="{{scopes}}" default-value="space"></x-import>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">Format</span>
<x-import component-from-global-scope="ForestUI.OptionList" label="Format" options="{{formats}}" default-value="json"></x-import>
</div>
<x-import component-from-global-scope="ForestUI.Switch" label="Inclure les photos (archive zip)" default-checked="{{yes}}"></x-import>
<div role="note" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line);">
<x-import component-from-global-scope="ForestUI.Icon" name="users"></x-import>
<span style="font-size: 14px; line-height: 20px;">Un export d’espace par jour. Les membres verront « Matthias a exporté l’espace » dans l’activité.</span>
</div>
</div>
<x-import component-from-global-scope="ForestUI.SheetFooter">
<x-import component-from-global-scope="ForestUI.Button" variant="primary">Préparer l’export</x-import>
</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, noop: function () {},
      scopes: [{ value: 'mine', label: 'Mes recettes', hint: '42 recettes dont je suis l’auteur, tous espaces' }, { value: 'space', label: 'Tout l’espace Famille', hint: '118 recettes · tu en es l’OWNER' }],
      formats: [{ value: 'json', label: 'JSON', hint: 'Se réimporte dans Forest Manager', icon: 'refresh' }, { value: 'md', label: 'Markdown', hint: 'Se lit partout', icon: 'book-open' }]
    };
  }
}
</script>
</body>
</html>
