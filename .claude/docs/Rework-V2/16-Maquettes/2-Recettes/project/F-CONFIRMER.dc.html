<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quitter sans enregistrer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line);">
    <button type="button" class="fm-btn fm-btn-ghost">Annuler</button>
    <span style="flex: 1; text-align: center; font: 600 16px/22px var(--font-display);">Nouvelle recette</span>
    <x-import component-from-global-scope="ForestUI.Button" variant="primary" size="sm">Enregistrer</x-import>
  </header>
  <main style="flex: 1; padding: 16px;">
    <x-import component-from-global-scope="ForestUI.Field" label="Titre" default-value="Gratin de Jeanne"></x-import>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Quitter sans enregistrer ?" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <p style="margin: 0; font-size: 15px; line-height: 22px;">Ta recette « Gratin de Jeanne » n'est pas enregistrée. Un brouillon est gardé sur ce téléphone : tu le retrouveras en créant une nouvelle recette.</p>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Continuer l'édition</x-import>
        <x-import component-from-global-scope="ForestUI.Button" variant="danger" block="{{yes}}">Quitter et supprimer le brouillon</x-import>
      </div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, noop: function () {} };
  }
}
</script>
</body>
</html>
