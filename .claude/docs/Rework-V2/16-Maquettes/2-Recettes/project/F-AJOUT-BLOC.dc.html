<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter un bloc</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line);">
    <button type="button" class="fm-btn fm-btn-ghost">Annuler</button>
    <span style="flex: 1; text-align: center; font: 600 16px/22px var(--font-display);">Saumon teriyaki</span>
    <x-import component-from-global-scope="ForestUI.Button" variant="primary" size="sm">Enregistrer</x-import>
  </header>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px;" class="fm-cq">
    <x-import component-from-global-scope="ForestUI.RecipeBlock" kind="local" title="Saumon et brocolis" ingredients="{{saumon}}" default-open="{{no}}"></x-import>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Ajouter un bloc" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer;">
        <span style="width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none;"><x-import component-from-global-scope="ForestUI.Icon" name="plus"></x-import></span>
        <span style="display: flex; flex-direction: column;"><b style="font-size: 15px;">Bloc local</b><span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Ses propres ingrédients et étapes, par exemple « Assemblage ».</span></span>
      </button>
      <a href="F-LIER-RECETTE.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px; border-radius: 14px; border: 1px solid var(--second-text); background: var(--second-soft); color: var(--ink); text-decoration: none;">
        <span style="width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-raised); color: var(--second-text); flex: none;"><x-import component-from-global-scope="ForestUI.Icon" name="link"></x-import></span>
        <span style="display: flex; flex-direction: column;"><b style="font-size: 15px;">Lier une recette</b><span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Réutiliser une recette existante, comme une sauce. Si elle change, ce plat suit.</span></span>
      </a>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      no: false,
      noop: function () {},
      saumon: [
        { quantity: 2, unit: 'pavés', name: 'saumon' },
        { quantity: 400, unit: 'g', name: 'brocolis' }
      ]
    };
  }
}
</script>
</body>
</html>
