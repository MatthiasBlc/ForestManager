<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Actions sur une recette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{personal}}" active-id="f"></x-import>
  <x-import component-from-global-scope="ForestUI.TopBar" title="Recettes" unread="{{unread}}"></x-import>
  <main style="flex: 1; overflow: hidden; padding: 16px;">
    <div class="fm-cq">
      <div class="fm-grid">
        <sc-for list="{{recipes}}" as="r" hint-placeholder-count="4">
          <x-import component-from-global-scope="ForestUI.RecipeCard" title="{{r.title}}" meta="{{r.meta}}" badges="{{r.badges}}"></x-import>
        </sc-for>
      </div>
    </div>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Saumon teriyaki et brocolis" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Ouvert par un appui long sur la carte.</span>
      <x-import component-from-global-scope="ForestUI.ActionMenu" label="Actions pour Saumon teriyaki et brocolis" items="{{actions}}"></x-import>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      unread: 3,
      noop: function () {},
      personal: { id: 'me', name: 'Matthias' },
      spaces: [
        { id: 'foyer', name: 'Foyer', tint: 5 },
        { id: 'f', name: 'Famille', tint: 1 },
        { id: 'c', name: 'Colloc', tint: 2 },
        { id: 't', name: 'TOM', tint: 3 },
        { id: 'a', name: 'Amis', tint: 4 }
      ],
      recipes: [
        { title: 'Saumon teriyaki et brocolis', meta: '2 pers. · 35 min', badges: [{ label: 'Composée', tone: 'second', icon: 'link' }] },
        { title: 'Sauce teriyaki', meta: '300 ml · 10 min', badges: [{ label: 'Base', tone: 'second' }] },
        { title: 'Poulet teriyaki et riz', meta: '4 pers. · 40 min', badges: [] },
        { title: 'Dahl de lentilles corail', meta: '4 pers. · 40 min', badges: [] }
      ],
      actions: [
        { id: 'edit', label: 'Modifier', icon: 'pencil' },
        { id: 'share', label: 'Partager dans un espace', icon: 'share' },
        { id: 'adapt', label: 'Adapter pour un espace', icon: 'git-branch' },
        { id: 'plan', label: 'Ajouter au planning', icon: 'calendar' },
        { id: 'history', label: 'Voir l’historique', icon: 'clock' },
        '-',
        { id: 'delete', label: 'Supprimer', icon: 'trash', danger: true }
      ]
    };
  }
}
</script>
</body>
</html>
