<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Éditeur de recette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <div style="position: relative;">
    <x-import component-from-global-scope="ForestUI.TopBar" title="Nouvelle recette" on-cancel="{{noop}}" action="Enregistrer" on-action="{{noop}}"></x-import>
    <a href="F-CONFIRMER.dc.html" aria-hidden="true" tabindex="-1" title="Annuler" style="position: absolute; left: 16px; top: 6px; width: 96px; height: 44px; border-radius: 10px;"></a>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--warning-soft); color: var(--warning-text); font-size: 14px; line-height: 20px;">
      <span style="font-weight: 700;">Importée depuis un texte.</span><span>Vérifie les champs marqués avant d'enregistrer.</span>
    </div>
    <x-import component-from-global-scope="ForestUI.Field" label="Titre" default-value="Gratin de Jeanne"></x-import>
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="fm-label">Pour</span>
        <x-import component-from-global-scope="ForestUI.Stepper" label="Portions" default-value="{{four}}" unit="pers."></x-import>
      </div>
      <x-import component-from-global-scope="ForestUI.Field" label="Préparation" default-value="15 min" style="flex: 1;"></x-import>
      <x-import component-from-global-scope="ForestUI.Field" label="Cuisson" default-value="30 min" style="flex: 1;"></x-import>
    </div>
    <section style="border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); overflow: hidden;">
      <div style="padding: 10px 12px; background: var(--surface); font: 600 16px/22px var(--font-display);">Ingrédients</div>
      <div style="padding: 4px 12px 8px; display: flex; flex-direction: column;">
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 8px;">
          <sc-for list="{{ings}}" as="i" hint-placeholder-count="5">
            <x-import component-from-global-scope="ForestUI.QuantityInput" units="{{units}}" suggestions="{{suggestions}}" default-quantity="{{i.q}}" default-unit="{{i.u}}" default-ingredient="{{i.n}}" error="{{i.error}}" on-remove="{{noop}}"></x-import>
          </sc-for>
        </div>
        <button type="button" class="fm-btn fm-btn-ghost" style="align-self: flex-start;">+ Ajouter un ingrédient</button>
      </div>
    </section>
    <section style="border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); overflow: hidden;">
      <div style="padding: 10px 12px; background: var(--surface); font: 600 16px/22px var(--font-display);">Étapes</div>
      <ol style="margin: 0; padding: 10px 12px 10px 32px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 22px;">
        <li>Cuire les pâtes al dente.</li>
        <li>Frotter le plat avec l'ail, y verser les pâtes.</li>
      </ol>
    </section>
    <a href="F-AJOUT-BLOC.dc.html" class="fm-btn fm-btn-secondary fm-btn-block" style="text-decoration: none;">+ Ajouter un bloc</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      four: 4,
      noop: function () {},
      units: ['g', 'kg', 'ml', 'cl', 'l', 'c. à soupe', 'c. à café', 'pièce', 'pavé', 'gousse', 'pincée', 'à goût'],
      suggestions: ['pâtes', 'pâtes fraîches', 'crème fraîche', 'crème liquide', 'gruyère râpé', 'emmental râpé', 'ail', 'sel', 'poivre', 'saumon', 'brocolis', 'sésame', 'citron vert'],
      ings: [
        { q: 500, u: 'g', n: 'pâtes' },
        { q: 40, u: 'cl', n: 'crème fraîche' },
        { q: 150, u: 'g', n: 'gruyère râpé' },
        { q: 1, u: 'gousse', n: 'ail' },
        { q: '', u: 'à goût', n: 'sel, poivre', error: 'Quantité non lue : choisis une unité ou « à goût ».' }
      ]
    };
  }
}
</script>
</body>
</html>
