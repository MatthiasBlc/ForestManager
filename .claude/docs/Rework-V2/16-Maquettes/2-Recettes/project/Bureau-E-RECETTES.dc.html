<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recettes de Famille, bureau</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="container-type: inline-size; min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <x-import component-from-global-scope="ForestUI.SpaceRail" spaces="{{spaces}}" personal="{{personal}}" active-id="f"></x-import>
  <x-import component-from-global-scope="ForestUI.ModuleNav" space-name="Famille" subtitle="6 membres" items="{{nav}}" active-id="recipes"></x-import>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <x-import component-from-global-scope="ForestUI.TopBar" title="Recettes" unread="{{unread}}" user="Matthias Bouloc"></x-import>
    <main style="padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 1120px; width: 100%; box-sizing: border-box;">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
        <h1 style="margin: 0 auto 0 0; font: 700 26px/32px var(--font-display);">Recettes</h1>
        <x-import component-from-global-scope="ForestUI.Button" icon="link">Importer</x-import>
        <x-import component-from-global-scope="ForestUI.Button" variant="primary" icon="plus">Nouvelle recette</x-import>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <x-import component-from-global-scope="ForestUI.Chip" default-selected="{{yes}}">Toutes</x-import>
        <x-import component-from-global-scope="ForestUI.Chip">Rapide</x-import>
        <x-import component-from-global-scope="ForestUI.Chip">Végétarien</x-import>
        <x-import component-from-global-scope="ForestUI.Chip">Plat du dimanche</x-import>
        <x-import component-from-global-scope="ForestUI.Chip">Bases</x-import>
        <x-import component-from-global-scope="ForestUI.Chip">Mes recettes</x-import>
      </div>
      <div class="fm-cq">
        <div class="fm-grid">
          <sc-for list="{{recipes}}" as="r" hint-placeholder-count="8">
            <x-import component-from-global-scope="ForestUI.RecipeCard" title="{{r.title}}" meta="{{r.meta}}" badges="{{r.badges}}" on-actions="{{noop}}"></x-import>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      unread: 3,
      noop: function () {},
      personal: { id: 'me', name: 'Matthias' },
      spaces: [
        { id: 'foyer', name: 'Foyer', tint: 5 },
        { id: 'f', name: 'Famille', tint: 1 },
        { id: 'c', name: 'Colloc', tint: 2 },
        { id: 't', name: 'TOM', tint: 3, unread: true },
        { id: 'a', name: 'Amis', tint: 4 }
      ],
      nav: [
        { id: 'recipes', label: 'Recettes', icon: 'book-open' },
        { id: 'plan', label: 'Planning', icon: 'calendar' },
        { id: 'members', label: 'Membres', icon: 'users' },
        { id: 'settings', label: 'Réglages', icon: 'settings' }
      ],
      recipes: [
        { title: 'Saumon teriyaki et brocolis', meta: '2 pers. · 35 min', badges: [{ label: 'Composée', tone: 'second', icon: 'link' }] },
        { title: 'Sauce teriyaki', meta: '300 ml · 10 min', badges: [{ label: 'Base', tone: 'second' }] },
        { title: 'Poulet teriyaki et riz', meta: '4 pers. · 40 min', badges: [] },
        { title: 'Dahl de lentilles corail', meta: '4 pers. · 40 min', badges: [] },
        { title: 'Escalope milanaise et compotée de tomates cerises', meta: '4 pers. · 45 min', badges: [{ label: 'Composée', tone: 'second', icon: 'link' }] },
        { title: 'Compotée de tomates cerises', meta: '4 pers. · 20 min', badges: [{ label: 'Base', tone: 'second' }] },
        { title: 'Gratin de pâtes', meta: '4 pers. · 50 min · par Léa', badges: [{ label: 'Partagée', tone: 'accent' }] },
        { title: 'Tarte aux pommes', meta: '6 pers. · 55 min', badges: [] }
      ]
    };
  }
}
</script>
</body>
</html>
