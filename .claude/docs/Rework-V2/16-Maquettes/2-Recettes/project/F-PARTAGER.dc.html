<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Partager sa recette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line);">
    <span style="flex: 1; padding-left: 8px; font: 600 15px/20px var(--font-sans); color: var(--ink-muted);">Famille · Recettes</span>
  </header>
  <main style="flex: 1; padding: 16px;">
    <h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Saumon teriyaki et brocolis</h1>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Partager dans tes espaces" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink-muted); font-size: 15px;">
        <x-import component-from-global-scope="ForestUI.Avatar" name="Famille" tint="{{t1}}" size="{{av}}"></x-import>
        <span style="flex: 1;">Famille</span><span style="font-size: 13px;">Espace d'origine</span>
      </div>
      <sc-for list="{{spaces}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px;">
          <x-import component-from-global-scope="ForestUI.Avatar" name="{{s.name}}" tint="{{s.tint}}" size="{{av}}"></x-import>
          <x-import component-from-global-scope="ForestUI.Switch" label="{{s.name}}" default-checked="{{s.on}}" style="flex: 1;"></x-import>
        </div>
      </sc-for>
      <div style="margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--second-soft); display: flex; flex-direction: column; gap: 4px;">
        <span style="font: 600 14px/20px var(--font-sans); color: var(--second-text);">Partagée avec elle</span>
        <span style="font-size: 14px; line-height: 20px;">Sauce teriyaki, la recette liée, est partagée dans les mêmes espaces pour que tout le monde voie les quantités.</span>
      </div>
      <div style="padding-top: 12px;">
        <x-import component-from-global-scope="ForestUI.Button" variant="primary" block="{{yes}}">Enregistrer</x-import>
      </div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      noop: function () {},
      t1: 1,
      av: 32,
      spaces: [
        { name: 'TOM', tint: 3, on: true },
        { name: 'Foyer', tint: 5, on: false },
        { name: 'Colloc', tint: 2, on: false },
        { name: 'Amis', tint: 4, on: false }
      ]
    };
  }
}
</script>
</body>
</html>
