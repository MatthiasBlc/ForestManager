<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle recette depuis une idée</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0} a{color:var(--accent-text)} a:hover{color:var(--ink)}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <div style="position: relative;">
    <x-import component-from-global-scope="ForestUI.TopBar" title="Nouvelle recette" on-cancel="{{noop}}" action="Enregistrer" on-action="{{noop}}"></x-import>
    <a href="F-CONFIRMER.dc.html" aria-hidden="true" tabindex="-1" title="Annuler" style="position: absolute; left: 16px; top: 6px; width: 96px; height: 44px; border-radius: 10px;"></a>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); font-size: 14px; line-height: 20px;">
      <x-import component-from-global-scope="ForestUI.Icon" name="sparkles" size="{{iconSize}}"></x-import>
      <span>Créée depuis l'idée de repas de Léa dans le planning de Famille : le titre et la note sont repris, complète le reste.</span>
    </div>
    <x-import component-from-global-scope="ForestUI.Field" label="Titre" default-value="Croque-monsieur maison"></x-import>
    <x-import component-from-global-scope="ForestUI.Field" label="Note" multiline="{{yes}}" default-value="Avec le pain de mie de la boulangerie et une béchamel légère."></x-import>
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="fm-label">Pour</span>
        <x-import component-from-global-scope="ForestUI.Stepper" label="Portions" default-value="{{four}}" unit="pers."></x-import>
      </div>
      <x-import component-from-global-scope="ForestUI.Field" label="Cuisson" placeholder="20 min" style="flex: 1;"></x-import>
    </div>
    <section style="border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); overflow: hidden;">
      <div style="padding: 10px 12px; background: var(--surface); font: 600 16px/22px var(--font-display);">Ingrédients</div>
      <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 8px;">
        <x-import component-from-global-scope="ForestUI.QuantityInput" units="{{units}}" suggestions="{{suggestions}}" placeholder="Premier ingrédient"></x-import>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      noop: function () {},
      yes: true,
      four: 4,
      iconSize: 18,
      units: ['g', 'kg', 'ml', 'cl', 'l', 'c. à soupe', 'c. à café', 'pièce', 'tranche', 'pincée', 'à goût'],
      suggestions: ['pain de mie', 'jambon blanc', 'emmental râpé', 'beurre', 'lait', 'farine']
    };
  }
}
</script>
</body>
</html>
