<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rédiger une suggestion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0} a{color:var(--accent-text)} a:hover{color:var(--ink)}</style>
</helmet>
<div class="fm-root" data-space="5" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <x-import component-from-global-scope="ForestUI.TopBar" title="Suggestion" on-cancel="{{noop}}" action="Envoyer" on-action="{{noop}}"></x-import>
  <div role="status" style="display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--accent-soft); color: var(--accent-text); font-size: 14px; line-height: 20px; font-weight: 600;">
    <x-import component-from-global-scope="ForestUI.Icon" name="pencil" size="{{iconSize}}"></x-import>
    <span>Mode suggestion : Léa verra tes changements et décidera.</span>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <x-import component-from-global-scope="ForestUI.Field" label="Titre" default-value="Gratin de pâtes"></x-import>
    <section style="border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised); overflow: hidden;">
      <div style="padding: 10px 12px; background: var(--surface); font: 600 16px/22px var(--font-display);">Ingrédients</div>
      <div style="padding: 4px 12px 8px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid var(--line);"><span style="font: 500 14px/20px var(--font-mono); min-width: 76px;">500 g</span><span style="flex: 1;">pâtes</span></div>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid var(--line); background: var(--warning-soft); margin: 0 -12px; padding: 0 12px;">
          <span style="font: 500 14px/20px var(--font-mono); min-width: 76px;"><s style="color: var(--ink-muted);">10 cl</s> 15 cl</span><span style="flex: 1;">crème fraîche</span>
          <x-import component-from-global-scope="ForestUI.Badge" tone="warning">Modifié</x-import>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid var(--line);"><span style="font: 500 14px/20px var(--font-mono); min-width: 76px;">150 g</span><span style="flex: 1;">emmental râpé</span></div>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; background: var(--success-soft); margin: 0 -12px; padding: 0 12px;">
          <span style="font: 500 14px/20px var(--font-mono); min-width: 76px;">1 pincée</span><span style="flex: 1;">muscade</span>
          <x-import component-from-global-scope="ForestUI.Badge" tone="success">Ajouté</x-import>
        </div>
      </div>
    </section>
    <x-import component-from-global-scope="ForestUI.Field" label="Pourquoi ce changement ? (facultatif)" multiline="{{yes}}" default-value="Plus crémeux avec 15 cl, et la muscade change tout."></x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { noop: function () {}, yes: true, iconSize: 16 };
  }
}
</script>
</body>
</html>
