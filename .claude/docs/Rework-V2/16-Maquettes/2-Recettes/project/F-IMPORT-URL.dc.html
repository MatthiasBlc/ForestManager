<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Importer depuis un lien</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <x-import component-from-global-scope="ForestUI.TopBar" title="Recettes" space="{{space}}" unread="{{unread}}"></x-import>
  <main style="flex: 1;"></main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Importer un lien" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="ForestUI.Field" label="Lien de la recette" default-value="https://blog-de-jeanne.fr/gratin-maison" input-mode="url" error="Cette page ne contient pas de recette que je sais lire. Copie son texte et colle-le à la place."></x-import>
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Les sites de recettes courants (Marmiton, HelloFresh, la plupart des blogs) sont lus automatiquement.</span>
    </div>
    <x-import component-from-global-scope="ForestUI.SheetFooter">
      <x-import component-from-global-scope="ForestUI.Button">Autre lien</x-import>
      <a href="F-IMPORT-TEXTE.dc.html" class="fm-btn fm-btn-primary" style="text-decoration: none;">Coller le texte</a>
    </x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      unread: 3,
      noop: function () {},
      space: { id: 'f', name: 'Famille', tint: 1 },
      personal: { id: 'me', name: 'Matthias' },
      spaces: [
        { id: 'foyer', name: 'Foyer', tint: 5 },
        { id: 'f', name: 'Famille', tint: 1 },
        { id: 'c', name: 'Colloc', tint: 2 },
        { id: 't', name: 'TOM', tint: 3 },
        { id: 'a', name: 'Amis', tint: 4 }
      ]
    };
  }
}
</script>
</body>
</html>
