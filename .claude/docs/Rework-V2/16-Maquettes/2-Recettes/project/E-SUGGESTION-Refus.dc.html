<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Refuser une suggestion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0} a{color:var(--accent-text)} a:hover{color:var(--ink)}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <div style="position: relative;">
    <x-import component-from-global-scope="ForestUI.TopBar" title="Suggestion" on-back="{{noop}}" unread="{{unread}}"></x-import>
    <a href="E-SUGGESTION.dc.html" aria-hidden="true" tabindex="-1" title="Retour" style="position: absolute; left: 16px; top: 6px; width: 44px; height: 44px; border-radius: 10px;"></a>
  </div>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px;">
    <b style="font-size: 15px;">Saumon teriyaki et brocolis</b>
    <span style="font-size: 14px; color: var(--ink-muted);">Suggestion de Noé · révision 4</span>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Refuser la suggestion de Noé" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 15px; line-height: 22px;">Ta recette ne change pas. Noé est prévenu et peut garder ses changements en faisant sa propre adaptation.</p>
      <x-import component-from-global-scope="ForestUI.Field" label="Un mot pour Noé (facultatif)" multiline="{{yes}}" default-value="3 min suffisent avec des pavés fins, mais l'oignon nouveau, je note pour la prochaine fois !"></x-import>
    </div>
    <x-import component-from-global-scope="ForestUI.SheetFooter">
      <x-import component-from-global-scope="ForestUI.Button">Annuler</x-import>
      <x-import component-from-global-scope="ForestUI.Button" variant="danger">Refuser</x-import>
    </x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      noop: function () {},
      unread: 3
    };
  }
}
</script>
</body>
</html>
