<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Demander le partage d'une recette de Léa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="5" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line);">
    <span style="flex: 1; padding-left: 8px; font: 600 15px/20px var(--font-sans); color: var(--ink-muted);">Foyer · Recettes</span>
  </header>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font: 700 26px/32px var(--font-display);">Gratin de pâtes</h1>
    <span style="font-size: 14px; color: var(--ink-muted);">par Léa · Foyer</span>
  </main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Partager dans un autre espace" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);">
        <x-import component-from-global-scope="ForestUI.Avatar" name="Léa Martin" tint="{{t5}}" size="{{av}}"></x-import>
        <span style="font-size: 14px; line-height: 20px;">Cette recette est celle de <b>Léa</b>. Elle reçoit ta demande et décide.</span>
      </div>
      <x-import component-from-global-scope="ForestUI.SegmentedControl" label="Espace cible" default-value="famille" options="{{targets}}"></x-import>
      <x-import component-from-global-scope="ForestUI.Field" label="Un mot pour Léa (facultatif)" default-value="Ta tante la réclame depuis Noël !"></x-import>
      <x-import component-from-global-scope="ForestUI.Button" variant="primary" icon="share" block="{{yes}}">Envoyer la demande</x-import>
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Tu seras prévenu de sa réponse. Si Léa a autorisé les membres de Foyer à partager ses recettes, le partage est immédiat.</span>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      noop: function () {},
      t5: 5,
      av: 36,
      targets: [
        { value: 'famille', label: 'Famille' },
        { value: 'colloc', label: 'Colloc' },
        { value: 'tom', label: 'TOM' },
        { value: 'amis', label: 'Amis' }
      ]
    };
  }
}
</script>
</body>
</html>
