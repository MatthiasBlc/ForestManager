<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lier une recette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line);">
    <button type="button" class="fm-btn fm-btn-ghost">Annuler</button>
    <span style="flex: 1; text-align: center; font: 600 16px/22px var(--font-display);">Saumon teriyaki</span>
    <x-import component-from-global-scope="ForestUI.Button" variant="primary" size="sm">Enregistrer</x-import>
  </header>
  <main style="flex: 1;"></main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Lier une recette" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <x-import component-from-global-scope="ForestUI.Field" label="Rechercher dans tes espaces" default-value="teri"></x-import>
      <span style="font: 600 12px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);">Bases d'abord</span>
      <x-import component-from-global-scope="ForestUI.OptionList" label="Recettes trouvées" options="{{results}}" default-value="sauce"></x-import>
      <div style="display: flex; align-items: flex-end; gap: 10px; padding-top: 4px;">
        <x-import component-from-global-scope="ForestUI.Field" label="Quantité utilisée" default-value="150" input-mode="decimal" style="flex: 1;"></x-import>
        <span style="min-height: 44px; display: flex; align-items: center; font: 500 14px/20px var(--font-mono); color: var(--ink-muted);">ml sur 300</span>
      </div>
      <span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">Pour 2 pers. : la moitié de la sauce. Les quantités suivent si tu changes les portions.</span>
    </div>
    <x-import component-from-global-scope="ForestUI.SheetFooter">
      <x-import component-from-global-scope="ForestUI.Button" variant="primary" icon="link">Lier la sauce teriyaki</x-import>
    </x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      noop: function () {},
      results: [
        { value: 'sauce', label: 'Sauce teriyaki', hint: 'Famille · rend 300 ml', icon: 'book-open', badge: 'Base', badgeTone: 'second' },
        { value: 'poulet', label: 'Poulet teriyaki et riz', hint: 'Famille · 4 pers.', icon: 'book-open' },
        { value: 'saumon', label: 'Saumon teriyaki et brocolis', hint: 'Impossible : c\'est la recette en cours', icon: 'book-open', disabled: true }
      ]
    };
  }
}
</script>
</body>
</html>
