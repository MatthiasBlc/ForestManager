<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Coller un texte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <x-import component-from-global-scope="ForestUI.TopBar" title="Recettes" space="{{space}}" unread="{{unread}}"></x-import>
  <main style="flex: 1;"></main>
  <x-import component-from-global-scope="ForestUI.Sheet" open="{{yes}}" title="Coller un texte" on-close="{{noop}}">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <x-import component-from-global-scope="ForestUI.Field" label="Texte de la recette" multiline="{{yes}}" default-value="{{pasted}}" hint="Titre, ingrédients et étapes, dans n'importe quel ordre."></x-import>
      <div role="status" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <x-import component-from-global-scope="ForestUI.Badge" tone="success">Titre repéré</x-import>
        <x-import component-from-global-scope="ForestUI.Badge" tone="success">5 ingrédients</x-import>
        <x-import component-from-global-scope="ForestUI.Badge" tone="success">4 étapes</x-import>
        <x-import component-from-global-scope="ForestUI.Badge" tone="warning">1 quantité à vérifier</x-import>
      </div>
    </div>
    <x-import component-from-global-scope="ForestUI.SheetFooter">
      <a href="E-RECETTE-EDITION.dc.html" class="fm-btn fm-btn-primary" style="text-decoration: none;">Ouvrir dans l'éditeur</a>
    </x-import>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      unread: 3,
      noop: function () {},
      pasted: 'Gratin de Jeanne\n500 g de pâtes\n40 cl de crème\n150 g de gruyère râpé\n1 gousse d’ail\nsel, poivre\nCuire les pâtes al dente. Frotter le plat avec l’ail...',
      space: { id: 'f', name: 'Famille', tint: 1 },
      personal: { id: 'me', name: 'Matthias' },
      spaces: [
        { id: 'foyer', name: 'Foyer', tint: 5 },
        { id: 'f', name: 'Famille', tint: 1 },
        { id: 'c', name: 'Colloc', tint: 2 },
        { id: 't', name: 'TOM', tint: 3 },
        { id: 'a', name: 'Amis', tint: 4 }
      ]
    };
  }
}
</script>
</body>
</html>
