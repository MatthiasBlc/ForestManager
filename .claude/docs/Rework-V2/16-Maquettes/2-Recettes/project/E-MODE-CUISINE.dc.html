<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mode cuisine</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fm-root" data-space="1" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px;">
    <div style="flex: 1; display: flex; flex-direction: column;">
      <span style="font: 600 12px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);">Étape 2 sur 6</span>
      <span style="font: 600 15px/20px var(--font-sans);">Saumon teriyaki et brocolis</span>
    </div>
    <x-import component-from-global-scope="ForestUI.IconButton" icon="x" label="Quitter le mode cuisine"></x-import>
  </header>
  <div style="height: 4px; margin: 0 16px; border-radius: 999px; background: var(--line);" aria-hidden="true">
    <div style="width: 33%; height: 100%; border-radius: 999px; background: var(--accent);"></div>
  </div>
  <main style="flex: 1; padding: 28px 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <x-import component-from-global-scope="ForestUI.Badge" tone="second" icon="link">Sauce teriyaki</x-import>
      <span style="font-size: 14px; color: var(--ink-muted);">150 ml pour 2 pers.</span>
    </div>
    <p style="margin: 0; font: 600 26px/36px var(--font-display);">Porter à frémissement, puis lier 2 minutes avec la fécule délayée dans un peu d'eau.</p>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: var(--surface-raised); border: 1px solid var(--line);">
      <span style="font: 600 12px/16px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);">Pour cette étape</span>
      <x-import component-from-global-scope="ForestUI.IngredientRow" quantity="{{q1}}" unit="ml" name="sauce soja, mirin et sucre mélangés"></x-import>
      <x-import component-from-global-scope="ForestUI.IngredientRow" quantity="{{q2}}" unit="c. à café" name="fécule de maïs"></x-import>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-muted);">
      <x-import component-from-global-scope="ForestUI.Icon" name="sparkles" size="{{iconSize}}"></x-import>Écran maintenu allumé
    </span>
  </main>
  <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); background: var(--surface);">
    <x-import component-from-global-scope="ForestUI.Button" icon="book-open" block="{{yes}}">Ingrédients</x-import>
    <div style="display: flex; gap: 8px;">
      <x-import component-from-global-scope="ForestUI.Button" style="flex: 1;">Précédente</x-import>
      <x-import component-from-global-scope="ForestUI.Button" variant="primary" style="flex: 2;">Suivante</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, q1: 120, q2: 0.5, iconSize: 16 };
  }
}
</script>
</body>
</html>
