<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Navigation admin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/forestui/tokens.css">
<link rel="stylesheet" href="ds/forestui/components/bundle.css">
<script src="ds/forestui/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<nav class="fm-root" aria-label="Administration" style="width: 248px; min-height: 1040px; box-sizing: border-box; background: var(--surface); border-right: 1px solid var(--line); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 20px; padding: 20px 12px;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
    <div style="width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;">FM</div>
    <div style="display: flex; flex-direction: column;">
      <b style="font-family: var(--font-display); font-size: 15px; line-height: 20px;">Forest Manager</b>
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Administration</span>
    </div>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="padding: 0 12px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">{{g.label}}</span>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
        <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
          <span style="flex: 1;">{{it.label}}</span>
          <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: var(--radius-full); background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; line-height: 22px; text-align: center;">{{it.count}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; padding: 12px; border-radius: var(--radius-md); background: var(--surface-raised); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 13px; line-height: 18px; font-weight: 600;">admin.matthias</span>
    <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Session admin, expire dans 24 min</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dash","demandes","modules","ing","unites","rayons","tags","espaces","changelog","audit"],"default":"dash"},"$preview":{"width":248,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dash';
    const base = 'display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: var(--radius-md); text-decoration: none; font-size: 14px; line-height: 20px; font-weight: 600;';
    const groups = [
      { label: 'Pilotage', items: [ { id: 'dash', label: 'Tableau de bord', href: 'Main.dc.html' } ] },
      { label: 'Modules', items: [ { id: 'demandes', label: "Demandes d'accès", href: 'A03-Demandes.dc.html', count: 2 }, { id: 'modules', label: 'Catalogue', href: 'A04-Catalogue-modules.dc.html' } ] },
      { label: 'Référentiels', items: [ { id: 'ing', label: 'Ingrédients', href: 'A05-Ingredients.dc.html', count: 4 }, { id: 'unites', label: 'Unités et conversions', href: 'A06-Unites.dc.html' }, { id: 'rayons', label: 'Rayons', href: 'A07-Rayons.dc.html' }, { id: 'tags', label: 'Tags globaux', href: 'A08-Tags-globaux.dc.html' } ] },
      { label: 'Plateforme', items: [ { id: 'espaces', label: 'Espaces', href: 'A09-Espaces.dc.html' }, { id: 'changelog', label: 'Changelog', href: 'A10-Changelog.dc.html' }, { id: 'audit', label: "Journal d'audit", href: 'A11-Journal-audit.dc.html' } ] }
    ];
    return {
      groups: groups.map((g) => ({
        label: g.label,
        items: g.items.map((it) => {
          const on = it.id === active;
          return {
            ...it,
            hasCount: !!it.count,
            current: on ? 'page' : undefined,
            style: base + (on ? ' background: var(--accent-soft); color: var(--accent-text);' : ' color: var(--ink-muted);')
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
