<!doctype html>
<html>
<head><meta charset="utf-8"><title>Skeleton</title>

</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex', gap:32, flexWrap:'wrap', alignItems:'flex-start'}},
  h('div', {style:{width:240}}, h('p', {className:'lbl'}, 'lines'), h(U.Skeleton, {})),
  h('div', {style:{width:240}}, h('p', {className:'lbl'}, 'row'), h(U.Skeleton, {kind:'row', count:4})),
  h('div', {className:'fm-cq', style:{width:260}}, h('p', {className:'lbl'}, 'card'), h(U.Skeleton, {kind:'card', count:2}))));
</script>
</body>
</html>
