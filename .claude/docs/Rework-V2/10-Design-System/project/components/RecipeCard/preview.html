<!-- @dsCard group="Recettes" height=340 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RecipeCard</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
function Demo(){ var m = React.useState(null);
  return h('div', {className:'fm-stack'},
    h('div', {className:'fm-cq', style:{maxWidth:560}}, h('div', {className:'fm-grid'},
      h(U.RecipeCard, {title:'Saumon teriyaki et brocolis', meta:'2 pers. - 35 min', badges:[{label:'Composee', tone:'second', icon:'link'}], onActions:function(){m[1]('Saumon teriyaki et brocolis');}}),
      h(U.RecipeCard, {title:'Gratin de pates', meta:'4 pers. - 50 min - adaptee', badges:[{label:'Original modifie', tone:'warning'}], onActions:function(){m[1]('Gratin de pates');}}),
      h(U.RecipeCard, {title:'Sauce teriyaki', meta:'300 ml - 10 min', badges:[{label:'Base', tone:'second'}], onActions:function(){m[1]('Sauce teriyaki');}}))),
    h('p', {className:'fm-muted', style:{margin:0, fontSize:14}}, m[0] ? 'Menu d\'actions ouvert pour : ' + m[0] : 'Astuce : appui long sur une carte (ou bouton ...) pour ouvrir ses actions.'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
