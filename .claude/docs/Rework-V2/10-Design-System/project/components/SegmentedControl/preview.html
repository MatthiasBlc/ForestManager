<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack'},
  h(U.SegmentedControl, {label:'Vue du planning', options:[{value:'week',label:'Semaine'},{value:'day',label:'Jour'}]}),
  h(U.SegmentedControl, {label:'Ambiance', defaultValue:'braise', options:[{value:'braise',label:'Braise'},{value:'sousbois',label:'Sous-bois'},{value:'potager',label:'Potager'}]})));
</script>
</body>
</html>
