<!doctype html>
<html>
<head><meta charset="utf-8"><title>QuantityInput</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
var units = ['g','kg','ml','cl','l','c. a soupe','c. a cafe','piece','pincee'];
var ings = ['Saumon','Sauce soja','Sucre','Sucre roux','Sucre glace','Gingembre','Brocoli','Riz basmati'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack', style:{maxWidth:390}},
  h(U.QuantityInput, {units:units, suggestions:ings, defaultQuantity:2, defaultUnit:'c. a soupe', defaultIngredient:'Sauce soja', onRemove:function(){}}),
  h(U.QuantityInput, {units:units, suggestions:ings, defaultQuantity:'1,5', defaultUnit:'c. a soupe', defaultIngredient:'suc', defaultOpen:true, onRemove:function(){}})));
</script>
</body>
</html>
