<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack', style:{maxWidth:420}},
  h(U.Field, {label:'Titre de la recette', placeholder:'Ex : Gratin de pates', defaultValue:'Saumon teriyaki et brocolis'}),
  h(U.Field, {label:'Portions', inputMode:'numeric', defaultValue:'', hint:'Nombre de personnes pour les quantites indiquees.'}),
  h(U.Field, {label:'Lien de la recette', defaultValue:'hellofresh', error:'Colle une adresse complete, qui commence par https://'})));
</script>
</body>
</html>
