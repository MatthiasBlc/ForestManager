<!doctype html>
<html>
<head><meta charset="utf-8"><title>PullToRefresh</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
function Demo(){ var n = React.useState(0);
  return h('div', {style:{maxWidth:390, border:'1px solid var(--line)', borderRadius:18, overflow:'hidden', background:'var(--bg)'}},
    h(U.PullToRefresh, {height:300, onRefresh:function(){ return new Promise(function(r){ setTimeout(function(){ n[1](n[0]+1); r(); }, 900); }); }},
      h('div', {className:'fm-pad fm-stack'}, h('p', {className:'fm-muted', style:{margin:0, fontSize:14}}, 'Tire la liste vers le bas. Actualisee ' + n[0] + ' fois.'),
        ['Lea a ajoute Dahl de lentilles', 'Sam propose une modification de Gratin de pates', 'Planning de la semaine genere', 'Noe a rejoint Famille'].map(function(t){ return h('div', {key:t, style:{padding:12, borderRadius:10, background:'var(--surface-raised)', border:'1px solid var(--line)'}}, t); }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
