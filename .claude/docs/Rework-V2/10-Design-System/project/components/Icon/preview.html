<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
var names = ['book-open','calendar','shopping-basket','users','settings','search','bell','plus','pencil','share','git-branch','link','lock','clock','chef-hat','trash','arrow-left','wifi-off','tag','ruler','shield','chevrons-up-down'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-row', style:{gap:16}}, names.map(function(n){ return h('span', {key:n, title:n, style:{display:'inline-flex', flexDirection:'column', alignItems:'center', gap:4, width:64, fontSize:11, color:'var(--ink-muted)'}}, h('span', {style:{color:'var(--ink)'}}, h(U.Icon, {name:n, size:24})), n); })));
</script>
</body>
</html>
