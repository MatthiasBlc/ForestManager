<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack'},
  h('div', {className:'fm-row'}, h(U.Button, {variant:'primary', icon:'plus'}, 'Nouvelle recette'), h(U.Button, null, 'Importer'), h(U.Button, {variant:'ghost', icon:'share'}, 'Partager'), h(U.Button, {variant:'danger', icon:'trash'}, 'Supprimer')),
  h('div', {className:'fm-row'}, h(U.Button, {variant:'primary', size:'sm'}, 'Enregistrer'), h(U.Button, {size:'sm'}, 'Annuler'), h(U.Button, {disabled:true}, 'Indisponible'))));
</script>
</body>
</html>
