<!doctype html>
<html>
<head><meta charset="utf-8"><title>RecipeBlock</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack fm-cq', style:{maxWidth:720}},
  h(U.RecipeBlock, {kind:'linked', title:'Sauce teriyaki', quantity:'150 ml', factor:0.5, ingredients:[{quantity:100, unit:'ml', name:'sauce soja'}, {quantity:60, unit:'ml', name:'mirin'}, {quantity:2, unit:'c. a soupe', name:'sucre'}], steps:['Melanger soja, mirin et sucre.', 'Porter a fremissement, lier 2 min.']}),
  h(U.RecipeBlock, {kind:'local', title:'Saumon et brocolis', ingredients:[{quantity:2, unit:'paves', name:'saumon'}, {quantity:300, unit:'g', name:'brocolis'}], steps:['Cuire les brocolis 6 min a la vapeur.', 'Saisir le saumon 3 min par face.']})));
</script>
</body>
</html>
