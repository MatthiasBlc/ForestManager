<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(U.CommandPalette, {defaultQuery:'teri', groups:[
  {label:'Recettes', items:[{id:'r1', label:'Sauce teriyaki', icon:'book-open', hint:'Famille - base'}, {id:'r2', label:'Saumon teriyaki et brocolis', icon:'book-open', hint:'Famille'}, {id:'r3', label:'Poulet teriyaki et riz', icon:'book-open', hint:'TOM'}]},
  {label:'Actions', items:[{id:'a1', label:'Nouvelle recette', icon:'plus'}, {id:'a2', label:'Planning de la semaine', icon:'calendar'}]}]}));
</script>
</body>
</html>
