<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cv svg { position: absolute; left: 480px; top: 0; }
  .slab { fill: var(--ink); }
  .ember { fill: var(--tint-1); }
  .night { fill: var(--tint-2); }
  .ash { fill: var(--tint-3); }
  .mark { fill: var(--bg); }
  .big { rx: var(--radius-xl); }
  .tile { rx: var(--radius-lg); }
  .add { fill: none; stroke: var(--bg); stroke-width: 2; stroke-dasharray: 5 4; }
  .txt { position: absolute; left: 40px; bottom: 36px; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 0.95; color: var(--ink); margin: 0; letter-spacing: -0.02em; }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: 0; }
</style>
</head>
<body>
<div class="cv">
  <!-- blocks: tint-1 (braise) 380x176 en haut a droite, tint-2 (nuit) 180x96 et tint-3 (tison) 184x96 en bas, rail en ink 72px de large sur toute la hauteur
       arrangement: un rail vertical a gauche de la zone, une grande dalle qui deborde en haut et a droite, deux tuiles en bas qui debordent du bas
       pattern: "geometric, modular" -> les icones d'espace du rail (disques size-space-icon), l'actif en carre radius-lg avec son repere : la navigation Discord est la signature de l'app
       steps: gouttieres space-4 (16px), rail size-rail (72px), icones 48px ; radii radius-lg (actif, tuiles), radius-xl (dalle), radius-full (disques) -->
  <svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
    <rect class="slab tile" x="16" y="-16" width="72" height="320"></rect>
    <circle class="ember" cx="52" cy="40" r="24"></circle>
    <rect class="night tile" x="28" y="80" width="48" height="48"></rect>
    <rect class="mark" x="16" y="92" width="4" height="24"></rect>
    <circle class="ash" cx="52" cy="168" r="24"></circle>
    <circle class="add" cx="52" cy="232" r="22"></circle>
    <rect class="ember big" x="104" y="-24" width="400" height="200"></rect>
    <rect class="night tile" x="104" y="192" width="180" height="120"></rect>
    <rect class="ash tile" x="300" y="192" width="200" height="120"></rect>
  </svg>
  <div class="txt">
    <p class="name">Forest<br>Manager</p>
    <p class="tag">Vos espaces prives, vos recettes, vos repas de la semaine.</p>
  </div>
</div>
</body>
</html>
