<!doctype html>
<html>
<head><meta charset="utf-8"><title>ActionMenu</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{maxWidth:280}}, h(U.ActionMenu, {label:'Actions pour Gratin de pates', items:[
  {id:'edit', label:'Modifier', icon:'pencil'}, {id:'share', label:'Partager dans un espace', icon:'share'}, {id:'adapt', label:'Adapter pour un espace', icon:'git-branch'}, {id:'plan', label:'Ajouter au planning', icon:'calendar'}, '-', {id:'del', label:'Supprimer', icon:'trash', danger:true}]})));
</script>
</body>
</html>
