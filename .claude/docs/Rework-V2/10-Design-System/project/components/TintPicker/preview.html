<!doctype html>
<html>
<head><meta charset="utf-8"><title>TintPicker</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fm-stack'}, h('p', {className:'lbl'}, "Teinte de l'espace"), h(U.TintPicker, {defaultValue:3, names:['Braise','Nuit','Tison','Flamme','Cendre']})));
</script>
</body>
</html>
