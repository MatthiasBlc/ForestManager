<!-- @dsCard group="Formulaires" height=420 width=820 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>OptionList</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex', gap:32, flexWrap:'wrap', alignItems:'flex-start'}},
  h('div', {style:{width:360}}, h('p', {className:'lbl'}, 'Un choix'), h(U.OptionList, {label:'Profil de generation', defaultValue:'semaine', options:[{value:'semaine', label:'Semaine normale', hint:'14 repas, 2 recettes nouvelles', icon:'calendar'}, {value:'rapide', label:'Semaine chargee', hint:'Recettes de moins de 30 min', icon:'clock'}, {value:'fete', label:'Week-end en famille', hint:'6 pers., 4 repas', icon:'users', badge:'Nouveau', badgeTone:'accent'}]})),
  h('div', {style:{width:360}}, h('p', {className:'lbl'}, 'Plusieurs choix'), h(U.OptionList, {label:'Espaces', multiple:true, defaultValue:['f'], options:[{value:'f', label:'Famille', hint:'6 membres', space:{name:'Famille', tint:1}}, {value:'c', label:'Colloc', hint:'3 membres', space:{name:'Colloc', tint:2}}, {value:'a', label:'Amis', hint:'5 membres', space:{name:'Amis', tint:4}}]})),
  h('div', {style:{width:360}}, h('p', {className:'lbl'}, 'Navigation (selectable false)'), h(U.OptionList, {label:'Resultats', selectable:false, options:[{value:'1', label:'Sauce teriyaki', hint:'Base - 300 ml', icon:'book-open'}, {value:'2', label:'Compotee de tomates cerises', hint:'Base - 4 pers.', icon:'book-open'}]}))));
</script>
</body>
</html>
