<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sheet</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
function Demo(){ var s = React.useState(true);
  return h('div', {style:{position:'relative', height:520, maxWidth:390, border:'1px solid var(--line)', borderRadius:22, overflow:'hidden', background:'var(--bg)'}},
    h('div', {className:'fm-pad fm-stack'}, h('b', null, 'Mardi soir'), h(U.Button, {onClick:function(){s[1](true);}}, 'Ouvrir la feuille')),
    h(U.Sheet, {open:s[0], contained:true, title:'Mardi soir', onClose:function(){s[1](false);},
      footer:[h(U.Button, {key:'a'}, 'Vider le repas'), h(U.Button, {key:'b', variant:'primary'}, 'Enregistrer')]},
      h('div', {className:'fm-stack'}, h(U.Field, {label:'Repas', defaultValue:'Saumon teriyaki et brocolis'}), h('div', {className:'fm-row'}, h('span', {className:'fm-muted'}, 'Portions'), h(U.Stepper, {label:'Portions', defaultValue:2, unit:'pers.'})), h(U.Switch, {label:'Verrouiller ce repas pour la generation'}))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
