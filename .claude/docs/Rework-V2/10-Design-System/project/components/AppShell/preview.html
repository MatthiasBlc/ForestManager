<!doctype html>
<html>
<head><meta charset="utf-8"><title>AppShell</title>
<style>body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)} .lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}</style>
</head>
<body class="fm-root">
<div id="root"></div>
<script>
var U = window.ForestUI, h = React.createElement;
var nav = [{id:'recipes', label:'Recettes', icon:'book-open'}, {id:'plan', label:'Planning', icon:'calendar'}, {id:'shop', label:'Courses', icon:'shopping-basket'}, {id:'members', label:'Membres', icon:'users'}];
var spaces = [{id:'f', name:'Famille', tint:1, unread:true}, {id:'c', name:'Colloc', tint:2}, {id:'t', name:'TOM', tint:3}, {id:'a', name:'Amis', tint:4}];
function Content(){ return h('div', {className:'fm-pad fm-stack fm-cq'},
  h('div', {className:'fm-row'}, h(U.Chip, {defaultSelected:true}, 'Toutes'), h(U.Chip, null, 'Rapide'), h(U.Chip, null, 'Bases')),
  h('div', {className:'fm-grid'}, ['Saumon teriyaki et brocolis', 'Gratin de pates', 'Sauce teriyaki', 'Dahl de lentilles'].map(function(t, i){ return h(U.RecipeCard, {key:t, title:t, meta:['2 pers. - 35 min','4 pers. - 50 min','300 ml - 10 min','4 pers. - 40 min'][i], badges: i===0?[{label:'Composee', tone:'second'}]:i===2?[{label:'Base', tone:'second'}]:[], onActions:function(){}}); }))); }
function Shell(w, tint, active){ return h('div', {style:{width:w, height:600, border:'1px solid var(--line)', borderRadius:18, overflow:'hidden', flex:'none'}},
  h(U.AppShell, {tint:tint, rail:h(U.SpaceRail, {activeId:active, personal:{id:'me', name:'Matthias'}, spaces:spaces}), nav:h(U.ModuleNav, {spaceName:'Famille', subtitle:'6 membres', activeId:'recipes', items:nav}), top:h(U.TopBar, {title:'Recettes', unread:3, user:'Matthias Bouloc'}), tabbar:h(U.TabBar, {activeId:'recipes', items:nav})}, h(Content))); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex', gap:24, alignItems:'flex-start'}}, Shell(375, '1', 'f'), Shell(1080, '1', 'f')));
</script>
</body>
</html>
