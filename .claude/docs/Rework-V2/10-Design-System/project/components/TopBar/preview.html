  h('p', {className:'lbl'}, '768px et plus'),
  h('div', {className:'fm-shell', style:{height:'auto'}}, h('div', {style:{width:820}}, h(U.TopBar, {title:'Recettes', unread:3, user:'Matthias Bouloc', space:{name:'Famille', tint:1}})))));
