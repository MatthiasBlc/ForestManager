# Suivi d'erreurs [D75, D196] : un seul Bugsink pour la preprod et la prod, dans
# sa propre stack Portainer (creee a la main par le proprietaire, hors CI).
# Un projet par environnement ; chaque DSN va dans un secret GitHub facultatif
# (DEV_SENTRY_DSN pour la preprod, SENTRY_DSN pour la prod). Notice : README.md.
#
# Variables a definir dans la stack Portainer :
#   BUGSINK_SECRET_KEY        50 caracteres aleatoires (openssl rand -base64 50)
#   BUGSINK_CREATE_SUPERUSER  "email:motdepasse" (premier demarrage seulement)
#
# Version fixee (regle des deux semaines) ; verifier la date de la tag sur
# Docker Hub avant d'en changer.

services:
  bugsink:
    image: bugsink/bugsink:2.6.2
    container_name: bugsink
    hostname: bugsink
    restart: unless-stopped
    environment:
      - SECRET_KEY=${BUGSINK_SECRET_KEY}
      - CREATE_SUPERUSER=${BUGSINK_CREATE_SUPERUSER}
      - BASE_URL=https://bugsink.matthias-bouloc.fr
      - BEHIND_HTTPS_PROXY=True
      - PORT=8000
      # Comptes crees par l'admin seulement ; une seule equipe.
      - USER_REGISTRATION=CB_ADMINS
      - SINGLE_TEAM=True
      # Garde-fous : une petite plateforme ne doit jamais remplir le disque.
      - MAX_EVENTS_PER_PROJECT_PER_HOUR=500
      - MAX_RETENTION_PER_PROJECT_EVENT_COUNT=10000
    volumes:
      # Base SQLite (/data/db.sqlite3) et evenements.
      - bugsink_data:/data
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bugsink.rule=Host(`bugsink.matthias-bouloc.fr`)"
      - "traefik.http.routers.bugsink.entrypoints=https"
      - "traefik.http.routers.bugsink.tls.certresolver=cloudflare"
      - "traefik.http.services.bugsink.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: proxy

volumes:
  bugsink_data:
