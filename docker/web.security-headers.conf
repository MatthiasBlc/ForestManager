# En-tetes de securite, inclus dans chaque location qui sert le front
# (un add_header dans une location annule ceux herites du server).
# connect-src et img-src s'ouvriront au stockage S3 (C3) et au temps reel (C6).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
