# nginx du front en preprod et prod : SPA + proxy de l'API.
# Le TLS est termine par Traefik en amont (X-Forwarded-Proto transmis tel quel).

# Resolution DNS paresseuse : nginx demarre meme si l'API n'est pas encore la.
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Fichiers de Vite nommes par empreinte : cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # index.html jamais en cache : un deploy est vu au prochain chargement.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Meme nom d'hote qu'en V1 : les stacks Portainer existantes sont reutilisees (D147).
    set $api_upstream http://forestmanager-backend:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }
}
