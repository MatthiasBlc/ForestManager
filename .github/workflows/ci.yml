# CI et deploy V2 [D147] : reprise de .github/workflows/deploy.yml de la V1
# (tag v1-final) avec les memes secrets, images, stacks Portainer et declencheurs.
#
#   push (sauf Developement) -> verification + build des images (sans push)
#   PR vers master        -> verification, images poussees, deploy preprod
#                            (seule CI de Developement [D201])
#   push sur master       -> verification, images poussees, deploy prod, tag
#
# Changements V2 : la verification du poste (format, lint, typecheck dont les
# cles i18n, audit), les tests en 3 morceaux dans docker/compose.test.yml (seuils
# de couverture a la fusion) et les parcours E2E (docker/compose.e2e.yml), en
# parallele ; images du
# monorepo (docker/*.Dockerfile) taguees `sha-<court>` (+ `latest` en prod) et
# deployees par ce tag ; deploys serialises par environnement.
# Rien ne part vers master avant C7 [D143].

name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    # Developement (preprod) part toujours vers master par PR : le run de la PR
    # suffit, un run de push en double ne verifierait rien de plus [D201].
    # Sans PR ouverte : lancement a la main (workflow_dispatch).
    branches-ignore: [Developement]
    tags-ignore: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ========================================
  # Verification statique (identique au poste)
  # ========================================
  # Verification, tests et E2E tournent en parallele ; les images attendent les
  # trois (2026-11-17 : ~14 min en serie avant, dont 6 min de tests).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10 (fourni avec Node 22) plante sur les peers de vitest.
      - name: npm 11
        run: npm install -g npm@11.21.1

      - name: Install
        run: npm ci

      - name: Prisma client (typecheck)
        run: npm exec --workspace=@fm/api -- prisma generate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Les ressources `fr` typent `t()` (apps/web/src/i18n/i18next.d.ts) : une
      # cle i18n absente echoue ici.
      - name: Typecheck (dont cles i18n)
        run: npm run typecheck

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  # ========================================
  # Tests en morceaux (docker/compose.test.yml), couverture fusionnee [D78]
  # ========================================
  # Chaque morceau a sa base et son stockage (un runner chacun) ; les seuils de
  # couverture se controlent a la fusion (VITEST_SHARD, vitest.config.ts).
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Tests (morceau ${{ matrix.shard }}/3)
        run: npm run test:shard -- --shard=${{ matrix.shard }}/3

      - name: Stop test database
        if: always()
        run: npm run test:down

      - name: Rapport du morceau
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Fusion des rapports et seuils de couverture
        run: npm run test:merge

  # ========================================
  # Parcours E2E (Chromium mobile + desktop) [D197]
  # ========================================
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parcours (docker/compose.e2e.yml)
        run: npm run e2e

      - name: Stop E2E stack
        if: always()
        run: npm run e2e:down

      # Traces, captures et videos des echecs (Playwright ne garde que ceux-la).
      - name: Rapport des echecs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # ========================================
  # Images (backend = API, frontend = nginx + SPA)
  # ========================================
  build:
    runs-on: ubuntu-latest
    needs: [verify, coverage, e2e]
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: docker/api.Dockerfile
          - image: frontend
            dockerfile: docker/web.Dockerfile
    env:
      PUSH: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: matrix.image == 'backend'
        with:
          node-version-file: .nvmrc

      # Notes de version (version suivante et items des commits) embarquees dans
      # l'image API ; le seed en cree le brouillon au demarrage [D187].
      - name: Release notes
        if: matrix.image == 'backend'
        run: node apps/api/src/scripts/release-notes.ts --out apps/api/release.json

      - name: Tags
        id: tags
        run: |
          BASE="${{ secrets.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}/${{ matrix.image }}"
          TAGS="${BASE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then TAGS="${TAGS},${BASE}:latest"; fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build (push on PR to master and on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Image simple, sans index ni attestation : un `garbage-collect
          # --delete-untagged` du registry effacerait les sous-images d'un index.
          provenance: false
          # Reperes du menage du serveur (job registry-prune).
          labels: forestmanager.image=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ========================================
  # Deploy preprod (PR vers master)
  # ========================================
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Portainer (preprod)
        run: TAG="sha-${GITHUB_SHA::7}" ./docker/deploy.sh
        env:
          DEPLOY_ENV: preprod
          HEALTH_URL: https://preprod-forestmanager.matthias-bouloc.fr/api/v1/config
          COMPOSE_FILE: docker/compose.preprod.yml
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API: ${{ secrets.PORTAINER_API }}
          STACK_ID: ${{ secrets.DEV_STACK_ID }}
          ENDPOINT_ID: ${{ secrets.ENDPOINT_ID }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.DEV_SENTRY_DSN }}
          DISCORD_CLIENT_ID: ${{ secrets.DEV_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DEV_DISCORD_CLIENT_SECRET }}

  # ========================================
  # Deploy prod (push sur master)
  # ========================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Portainer (production)
        run: TAG="sha-${GITHUB_SHA::7}" ./docker/deploy.sh
        env:
          DEPLOY_ENV: production
          HEALTH_URL: https://forestmanager.matthias-bouloc.fr/api/v1/config
          COMPOSE_FILE: docker/compose.prod.yml
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API: ${{ secrets.PORTAINER_API }}
          STACK_ID: ${{ secrets.STACK_ID }}
          ENDPOINT_ID: ${{ secrets.ENDPOINT_ID }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

  # ========================================
  # Menage du registry apres un deploy reussi
  # ========================================
  # Garde les 10 derniers `sha-*` par image et `latest` (docker/registry-prune.sh) ;
  # un echec ne casse pas la CI, le deploy est deja fait.
  registry-prune:
    runs-on: ubuntu-latest
    needs: [deploy-preprod, deploy-prod]
    if: always() && (needs.deploy-preprod.result == 'success' || needs.deploy-prod.result == 'success')
    continue-on-error: true
    concurrency:
      group: registry-prune
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prune old image tags
        run: PROTECT_TAG="sha-${GITHUB_SHA::7}" ./docker/registry-prune.sh
        env:
          KEEP: 10
          # Premier passage a blanc : liste ce qui serait supprime ; a retirer
          # apres relecture du log par le proprietaire.
          DRY_RUN: 1
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

      # Images du serveur que plus aucun conteneur n'utilise, de plus de 3 jours,
      # et seulement les notres (label pose au build) : le serveur porte d'autres
      # stacks. Un retour arriere re-tire son tag du registry.
      - name: Prune unused images on the server
        run: |
          FILTERS=$(jq -cn '{dangling: ["false"], until: ["72h"], label: ["forestmanager.image"]}')
          curl -sS -f -X POST -G \
            "${PORTAINER_URL}/api/endpoints/${ENDPOINT_ID}/docker/images/prune" \
            --data-urlencode "filters=${FILTERS}" \
            -H "X-API-Key: ${PORTAINER_API}" |
            jq -r '"images supprimees : \((.ImagesDeleted // []) | length), espace libere : \(.SpaceReclaimed / 1048576 | floor) Mo"'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API: ${{ secrets.PORTAINER_API }}
          ENDPOINT_ID: ${{ secrets.ENDPOINT_ID }}

  # ========================================
  # Tag de version apres la prod
  # ========================================
  # La version est celle de release.json, recalculee sur le meme commit [D187].
  release-tag:
    runs-on: ubuntu-latest
    needs: deploy-prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tag v<version des notes>
        run: |
          VERSION="v$(node apps/api/src/scripts/release-notes.ts --version)"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, nothing to do"
            exit 0
          fi
          git tag "${VERSION}"
          git push origin "${VERSION}"
          echo "Tagged ${VERSION}"
